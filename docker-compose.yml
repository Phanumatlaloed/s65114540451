version: "3.9"

services:
  web:
    build: .
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=PathPrefix(`/s65114540451`)"
      - "traefik.http.routers.django.entrypoints=exam"
      - "traefik.http.services.django.loadbalancer.server.port=8000"

      # 👇 strip prefix
      - "traefik.http.middlewares.stripstudentprefix.stripprefix.prefixes=/s65114540451"
      - "traefik.http.routers.django.middlewares=stripstudentprefix"


  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"

      # 👇 entrypoint ฟังที่ port 10451
      - "--entrypoints.exam.address=:10451"
    ports:
      - "10451:10451"
      - "8080:8080" # Traefik dashboard (optional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
